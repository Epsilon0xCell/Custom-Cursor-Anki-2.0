<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" role="img" aria-label="The milk round crossing a terraced street, animated scene">
  <rect width="900" height="240" fill="#26344f"/>
  <rect id="sky-cycle" width="900" height="90" fill="#26344f">
    <animate attributeName="fill" values="#26344f;#4a5468;#26344f" dur="36s" repeatCount="indefinite"/>
  </rect>
  <g id="rooftops" fill="#141c2c">
    <polygon points="0,90 0,58 90,58 90,90 150,90 150,50 250,50 250,90 330,90 330,60 430,60 430,90 520,90 520,52 620,52 620,90 710,90 710,58 810,58 810,90 900,90 900,240 0,240"/>
  </g>
  <g id="lamps-dimming" fill="#f6d682">
    <circle cx="120" cy="76" r="6"><animate attributeName="opacity" values="1;0.25;1" dur="18s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="76" r="6"><animate attributeName="opacity" values="1;0.25;1" dur="18s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="76" r="6"><animate attributeName="opacity" values="1;0.25;1" dur="18s" begin="6s" repeatCount="indefinite"/></circle>
    <circle cx="750" cy="76" r="6"><animate attributeName="opacity" values="1;0.25;1" dur="18s" begin="9s" repeatCount="indefinite"/></circle>
  </g>
  <g id="clock-hands">
    <circle cx="852" cy="52" r="17" fill="#e8e6da"/>
    <line x1="852" y1="52" x2="852" y2="40" stroke="#26344f" stroke-width="2.6"><animateTransform attributeName="transform" type="rotate" values="0 852 52;360 852 52" dur="60s" repeatCount="indefinite"/></line>
    <line x1="852" y1="52" x2="862" y2="56" stroke="#26344f" stroke-width="2"><animateTransform attributeName="transform" type="rotate" values="0 852 52;360 852 52" dur="720s" repeatCount="indefinite"/></line>
  </g>
  <rect x="0" y="150" width="900" height="90" fill="#3c4350"/>
  <g id="float-creeping">
    <rect x="0" y="118" width="150" height="52" fill="#2c5c42"/>
    <rect x="8" y="126" width="34" height="20" fill="#a8c4d2"/>
    <circle cx="32" cy="176" r="13" fill="#141414"/><circle cx="118" cy="176" r="13" fill="#141414"/>
    <g fill="#eef0e9">
      <ellipse cx="66" cy="138" rx="5" ry="9"><animateTransform attributeName="transform" type="rotate" values="0 66 138;4 66 138;0 66 138" dur="2.2s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="82" cy="138" rx="5" ry="9"><animateTransform attributeName="transform" type="rotate" values="0 82 138;-4 82 138;0 82 138" dur="2.2s" begin="0.5s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="98" cy="138" rx="5" ry="9"><animateTransform attributeName="transform" type="rotate" values="0 98 138;4 98 138;0 98 138" dur="2.2s" begin="1s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="114" cy="138" rx="5" ry="9"><animateTransform attributeName="transform" type="rotate" values="0 114 138;-4 114 138;0 114 138" dur="2.2s" begin="1.5s" repeatCount="indefinite"/></ellipse>
    </g>
    <animateTransform attributeName="transform" type="translate" values="-170 0;920 0" dur="46s" repeatCount="indefinite"/>
  </g>
  <g id="milkman-crossing">
    <g>
      <rect x="-10" y="118" width="20" height="44" fill="#1c2026"/>
      <circle cx="0" cy="108" r="8" fill="#36302a"/>
      <rect x="-24" y="132" width="16" height="14" fill="none" stroke="#8a6d42" stroke-width="2.6"/>
      <animateTransform attributeName="transform" type="translate" values="560 0;330 0;560 0" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0.45;1" keyTimes="0;0.45;0.55;1" dur="20s" repeatCount="indefinite"/>
    </g>
  </g>
  <g id="doorstep-bottles" fill="#ccd4d2">
    <rect x="600" y="168" width="13" height="26"/><rect x="622" y="168" width="13" height="26"/>
    <rect x="644" y="168" width="13" height="26" fill="#f2f2ea"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4;0.5;1" dur="20s" repeatCount="indefinite"/></rect>
  </g>
  <g id="near-wall">
    <rect x="0" y="206" width="900" height="12" fill="#6e5c50"/>
    <g id="cat-on-wall" fill="#232326">
      <ellipse cx="0" cy="196" rx="17" ry="9"/>
      <circle cx="16" cy="188" r="7"/>
      <animateTransform attributeName="transform" type="translate" values="-40 0;420 0;420 0;940 0" keyTimes="0;0.35;0.6;1" dur="52s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
